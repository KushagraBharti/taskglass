name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    name: macOS ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Toolchain
        run: |
          swift --version
          uname -m
      - name: Native sampler and lifecycle tests
        run: ./scripts/test.sh
      - name: Build macOS 14 deployment target
        run: ./scripts/build-app.sh
      - name: Read-only hardware availability check
        run: ./scripts/check-hardware.sh
